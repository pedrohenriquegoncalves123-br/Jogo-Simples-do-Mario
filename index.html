<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Game</title>
    <link rel="stylesheet" href="../CSS/stytle.css">
    <link rel="stylesheet" href="../CSS/fimDeJogo.css">
    <link rel="stylesheet" href="../CSS/aparencia.css">
</head>

<body>

    <div class="container">
        <div class="sol"></div>
        <div class="nuvem nuvem-1"></div>
        <div class="nuvem nuvem-2"></div>
        <div class="morro morro-grande"></div>
        <div class="morro morro-pequeno"></div>
        <div class="chao-grama"></div>
        <div class="chao-terra"></div>

        <div class="placar-game">
            <p class="title">placar</p>
            <p>(<span id="contador">0</span>)</p>
        </div>
        <img src="../imagens/nuvens-mario.png" alt="" class="nuvens">
        <img src="../imagens/mario.gif" alt="mario" class="mario">
        <img src="../imagens/tubo-jogo-mario.png" alt="tubo" class="tubo">
    </div>

    <div class="game-over-screen">
        <div class="card-game-over">
            <h1 class="titulo-game-over">GAME OVER</h1>

            <div class="caixa-pontuacao">
                <p>PONTUAÇÃO</p>
                <span class="placar-final"></span>
            </div>

            <button class="btn-reiniciar">
                JOGAR NOVAMENTE
            </button>
        </div>
    </div>
    <div class="btn-pular"><span class="seta-pular"></span></div>


    <script src="../JS/interacao-jogo.js"></script>
</body>

</html>
